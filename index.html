<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        }

        .wrapper {
            width: 100%;
            max-width: 1280px;
        }

        .code-board {
            background: #0a0a0a;
            border: 1px solid #1f1f1f;
            border-radius: 12px;
            box-shadow: 
                0 0 0 1px rgba(255,255,255,0.03),
                0 25px 50px -12px rgba(0,0,0,0.8),
                0 0 80px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .code-header {
            background: #111;
            border-bottom: 1px solid #1f1f1f;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        .code-body {
            padding: 24px 28px 28px;
            max-height: 82vh;
            overflow-y: auto;
            overflow-x: auto;
        }

        /* Custom scrollbar */
        .code-body::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        .code-body::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        .code-body::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 5px;
        }
        .code-body::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }

        .code-line {
            font-size: 13.5px;
            line-height: 1.7;
            white-space: pre;
            margin-bottom: 2px;
            letter-spacing: 0.2px;
        }

        .line-num {
            color: #3f3f46;
            user-select: none;
            display: inline-block;
            width: 42px;
            text-align: right;
            margin-right: 18px;
        }

        .c-purple { color: #c084fc; }
        .c-green  { color: #4ade80; }
        .c-white  { color: #e4e4e7; }
        .c-red    { color: #f87171; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="code-board">
            <div class="code-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="code-body" id="codeBoard"></div>
        </div>
    </div>

    <script>
        const colors = ["c-purple", "c-green", "c-white", "c-red"];

        function colorize(line) {
            const parts = line.split(/(\s+|[{}()\[\];,.=<>!&|?:])/).filter(p => p.length > 0);
            const shuffled = [...colors].sort(() => Math.random() - 0.5).slice(0, 3);
            let html = "";
            let colorIndex = 0;

            parts.forEach((part, i) => {
                const cls = shuffled[colorIndex % 3];
                html += `<span class="${cls}">${part}</span>`;
                if (i % 3 === 2) colorIndex++;
            });
            return html;
        }

        // 200 dòng code rất dài, phong cách chuyên gia

            `    const discoveryService = await ServiceDiscovery.connect(config.seedNodes || ["10.0.0.11:8500", "10.0.0.12:8500", "10.0.0.13:8500"], { healthCheckInterval: 5000, deregisterCriticalAfter: "30s" });`,
            `    const consistentHashRing = new ConsistentHashRing(await discoveryService.getHealthyNodes(), { virtualNodesPerNode: 256, hashFunction: "xxhash64", replicationFactor: config.replicationFactor });`,
            `    const connectionPool = new ConnectionPool({ maxSize: config.maxConnections, acquireTimeout: 3000, idleTimeout: config.idleTimeout, evictionPolicy: "lru", validationQuery: "SELECT 1" });`,

            ``,
            `class TwoPhaseCommitCoordinator {`,
            `    constructor(participants = [], options = { timeoutMs: 15000, retryPolicy: { maxAttempts: 3, backoffMultiplier: 2, initialDelay: 200 } }) {`,
            `        this.participants = new Map(participants.map(p => [p.nodeId, Object.freeze({ ...p, status: "UNKNOWN" })]));`,
            `        this.timeoutMs = options.timeoutMs; this.retryPolicy = options.retryPolicy; this.transactionLog = new AppendOnlyLog({ path: "/var/log/tx.log", fsync: true });`,
            `    }`,
            ``,
            `    async execute(transactionId, operations) {`,
            `        const prepareResults = await Promise.allSettled([...this.participants.values()].map(async (participant) => {`,
            `            return retryWithExponentialBackoff(() => participant.prepare(transactionId, operations), this.retryPolicy);`,
            `        }));`,
            `        const allPrepared = prepareResults.every(r => r.status === "fulfilled" && r.value === "PREPARED");`,
            `        if (allPrepared) {`,
            `            await this.transactionLog.append({ type: "COMMIT", transactionId, timestamp: Date.now() });`,
            `            await Promise.all([...this.participants.values()].map(p => p.commit(transactionId)));`,
            `            return { status: "COMMITTED", transactionId, participants: this.participants.size };`,
            `        }`,
            `        await this.transactionLog.append({ type: "ABORT", transactionId, timestamp: Date.now() });`,
            `        await Promise.allSettled([...this.participants.values()].map(p => p.abort(transactionId)));`,
            `        return { status: "ABORTED", transactionId, reason: "prepare_phase_failed" };`,
            `    }`,
            `}`,
            ``,
            `const createReactivePipeline = (...operators) => (source) => operators.reduce((stream, operator) => operator(stream), source);`,
            `const map = (fn) => (stream) => createObservable(observer => stream.subscribe({ next: v => observer.next(fn(v)), error: e => observer.error(e), complete: () => observer.complete() }));`,
            `const filter = (predicate) => (stream) => createObservable(observer => stream.subscribe({ next: v => predicate(v) && observer.next(v), error: e => observer.error(e), complete: () => observer.complete() }));`,
            `const flatMap = (fn) => (stream) => createObservable(observer => stream.subscribe({ next: v => fn(v).subscribe(observer), error: e => observer.error(e), complete: () => observer.complete() }));`,
            ``,
            `class LockFreeMPMCQueue {`,
            `    constructor(capacity = 1024) {`,
            `        this.capacity = capacity; this.buffer = new Array(capacity); this.head = new AtomicLong(0); this.tail = new AtomicLong(0);`,
            `        for (let i = 0; i < capacity; i++) this.buffer[i] = { sequence: new AtomicLong(i), data: null };`,
            `    }`,
            `    enqueue(item) {`,
            `        let tail, cell;`,
            `        do {`,
            `            tail = this.tail.get(); cell = this.buffer[tail % this.capacity];`,
            `            const seq = cell.sequence.get(); const dif = seq - tail;`,
            `            if (dif === 0) { if (this.tail.compareAndSet(tail, tail + 1)) break; }`,
            `            else if (dif < 0) return false;`,
            `        } while (true);`,
            `        cell.data = item; cell.sequence.set(tail + 1); return true;`,
            `    }`,
            `    dequeue() {`,
            `        let head, cell;`,
            `        do {`,
            `            head = this.head.get(); cell = this.buffer[head % this.capacity];`,
            `            const seq = cell.sequence.get(); const dif = seq - (head + 1);`,
            `            if (dif === 0) { if (this.head.compareAndSet(head, head + 1)) break; }`,
            `            else if (dif < 0) return null;`,
            `        } while (true);`,
            `        const data = cell.data; cell.data = null; cell.sequence.set(head + this.capacity); return data;`,
            `    }`,
            `}`,
            ``,
            `async function parallelMapWithConcurrency(items, mapper, { concurrency = 16, onProgress = null } = {}) {`,
            `    const results = new Array(items.length); let nextIndex = 0; let completed = 0;`,
            `    const worker = async () => {`,
            `        while (true) {`,
            `            const current = nextIndex++; if (current >= items.length) break;`,
            `            results[current] = await mapper(items[current], current);`,
            `            completed++; if (onProgress) onProgress(completed, items.length);`,
            `        }`,
            `    };`,
            `    await Promise.all(Array.from({ length: Math.min(concurrency, items.length) }, () => worker()));`,
            `    return results;`,
            `}`,
            ``,
            `class AdaptiveLRUCache {`,
            `    constructor({ maxSize = 10000, maxAgeMs = 300000, onEvict = null } = {}) {`,
            `        this.maxSize = maxSize; this.maxAgeMs = maxAgeMs; this.onEvict = onEvict;`,
            `        this.cache = new Map(); this.accessOrder = new Map(); this.timers = new Map();`,
            `    }`,
            `    get(key) {`,
            `        if (!this.cache.has(key)) return undefined;`,
            `        const entry = this.cache.get(key);`,
            `        if (Date.now() - entry.createdAt > this.maxAgeMs) { this.delete(key); return undefined; }`,
            `        this.accessOrder.delete(key); this.accessOrder.set(key, Date.now());`,
            `        return entry.value;`,
            `    }`,
            `    set(key, value) {`,
            `        if (this.cache.has(key)) this.delete(key);`,
            `        if (this.cache.size >= this.maxSize) {`,
            `            const oldestKey = this.accessOrder.keys().next().value;`,
            `            this.delete(oldestKey);`,
            `        }`,
            `        this.cache.set(key, { value, createdAt: Date.now() });`,
            `        this.accessOrder.set(key, Date.now());`,
            `        const timer = setTimeout(() => this.delete(key), this.maxAgeMs);`,
            `        this.timers.set(key, timer);`,
            `    }`,
            `    delete(key) {`,
            `        if (!this.cache.has(key)) return false;`,
            `        const entry = this.cache.get(key);`,
            `        this.cache.delete(key); this.accessOrder.delete(key);`,
            `        clearTimeout(this.timers.get(key)); this.timers.delete(key);`,
            `        if (this.onEvict) this.onEvict(key, entry.value);`,
            `        return true;`,
            `    }`,
            `}`,
            ``,
            `async function retryWithJitter(fn, { maxAttempts = 5, baseDelayMs = 100, maxDelayMs = 10000, jitterFactor = 0.2 } = {}) {`,
            `    let attempt = 0; let lastError;`,
            `    while (attempt < maxAttempts) {`,
            `        try { return await fn(attempt); } catch (err) {`,
            `            lastError = err; attempt++;`,
            `            if (attempt >= maxAttempts) break;`,
            `            const exponentialDelay = Math.min(baseDelayMs * Math.pow(2, attempt), maxDelayMs);`,
            `            const jitter = exponentialDelay * jitterFactor * (Math.random() * 2 - 1);`,
            `            await new Promise(r => setTimeout(r, Math.max(0, exponentialDelay + jitter)));`,
            `        }`,
            `    }`,
            `    throw lastError;`,
            `}`,
            ``,
            `class CircuitBreaker {`,
            `    constructor({ failureThreshold = 5, successThreshold = 3, timeoutMs = 30000, monitoringPeriodMs = 60000 } = {}) {`,
            `        this.failureThreshold = failureThreshold; this.successThreshold = successThreshold; this.timeoutMs = timeoutMs;`,
            `        this.state = "CLOSED"; this.failureCount = 0; this.successCount = 0; this.nextAttempt = 0;`,
            `    }`,
            `    async execute(fn) {`,
            `        if (this.state === "OPEN") {`,
            `            if (Date.now() < this.nextAttempt) throw new Error("CircuitBreaker is OPEN");`,
            `            this.state = "HALF_OPEN";`,
            `        }`,
            `        try {`,
            `            const result = await fn();`,
            `            this.onSuccess(); return result;`,
            `        } catch (err) {`,
            `            this.onFailure(); throw err;`,
            `        }`,
            `    }`,
            `    onSuccess() {`,
            `        this.failureCount = 0;`,
            `        if (this.state === "HALF_OPEN") {`,
            `            this.successCount++;`,
            `            if (this.successCount >= this.successThreshold) { this.state = "CLOSED"; this.successCount = 0; }`,
            `        }`,
            `    }`,
            `    onFailure() {`,
            `        this.failureCount++; this.successCount = 0;`,
            `        if (this.failureCount >= this.failureThreshold) { this.state = "OPEN"; this.nextAttempt = Date.now() + this.timeoutMs; }`,
            `    }`,
            `}`,

            `const createWorkerPool = (scriptURL, poolSize = navigator.hardwareConcurrency || 4) => {`,
            `    const workers = Array.from({ length: poolSize }, () => new Worker(scriptURL));`,
            `    const queue = []; let active = 0; let cursor = 0;`,
            `    const processQueue = () => {`,
            `        while (queue.length > 0 && active < poolSize) {`,
            `            const { data, resolve, reject } = queue.shift();`,
            `            const worker = workers[cursor++ % poolSize]; active++;`,
            `            const onMessage = (e) => { worker.removeEventListener("message", onMessage); worker.removeEventListener("error", onError); active--; resolve(e.data); processQueue(); };`,
            `            const onError = (e) => { worker.removeEventListener("message", onMessage); worker.removeEventListener("error", onError); active--; reject(e); processQueue(); };`,
            `            worker.addEventListener("message", onMessage); worker.addEventListener("error", onError); worker.postMessage(data);`,
            `        }`,
            `    };`,
            `    return { run: (data) => new Promise((resolve, reject) => { queue.push({ data, resolve, reject }); processQueue(); }) };`,
            `};`,

            `class PriorityQueue {`,
            `    constructor(comparator = (a, b) => a.priority - b.priority) { this.heap = []; this.compare = comparator; }`,
            `    push(item) { this.heap.push(item); this._siftUp(this.heap.length - 1); }`,
            `    pop() { if (this.heap.length === 0) return undefined; const top = this.heap[0]; const last = this.heap.pop(); if (this.heap.length > 0) { this.heap[0] = last; this._siftDown(0); } return top; }`,
            `    _siftUp(i) { while (i > 0) { const p = (i - 1) >> 1; if (this.compare(this.heap[i], this.heap[p]) >= 0) break; [this.heap[i], this.heap[p]] = [this.heap[p], this.heap[i]]; i = p; } }`,
            `    _siftDown(i) { const n = this.heap.length; while (true) { let l = i * 2 + 1, r = l + 1, s = i; if (l < n && this.compare(this.heap[l], this.heap[s]) < 0) s = l; if (r < n && this.compare(this.heap[r], this.heap[s]) < 0) s = r; if (s === i) break; [this.heap[i], this.heap[s]] = [this.heap[s], this.heap[i]]; i = s; } }`,
            `    get size() { return this.heap.length; }`,
            `}`,

            `class RateLimiterTokenBucket {`,
            `    constructor({ capacity = 100, refillRate = 10, refillIntervalMs = 1000 } = {}) {`,
            `        this.capacity = capacity; this.tokens = capacity; this.refillRate = refillRate; this.refillIntervalMs = refillIntervalMs; this.lastRefill = Date.now();`,
            `    }`,
            `    async acquire(tokens = 1) {`,
            `        this._refill();`,
            `        if (this.tokens >= tokens) { this.tokens -= tokens; return true; }`,
            `        const waitMs = Math.ceil((tokens - this.tokens) * this.refillIntervalMs / this.refillRate);`,
            `        await new Promise(r => setTimeout(r, waitMs));`,
            `        return this.acquire(tokens);`,
            `    }`,
            `    _refill() {`,
            `        const now = Date.now(); const elapsed = now - this.lastRefill;`,
            `        const newTokens = (elapsed / this.refillIntervalMs) * this.refillRate;`,
            `        this.tokens = Math.min(this.capacity, this.tokens + newTokens); this.lastRefill = now;`,
            `    }`,
            `}`,

            `class Trie {`,
            `    constructor() { this.root = new TrieNode(); }`,
            `    insert(word, metadata = null) { let node = this.root; for (const char of word) { if (!node.children.has(char)) node.children.set(char, new TrieNode()); node = node.children.get(char); } node.isEndOfWord = true; node.metadata = metadata; }`,

            `function topologicalSort(graph) {`,
            `    const visited = new Set(); const result = []; const temp = new Set();`,
            `    const visit = (node) => {`,
            `        if (temp.has(node)) throw new Error("Cycle detected involving node: " + node);`,
            `        if (visited.has(node)) return;`,
            `        temp.add(node); (graph[node] || []).forEach(visit); temp.delete(node); visited.add(node); result.push(node);`,
            `    };`,
            `    Object.keys(graph).forEach(visit); return result.reverse();`,
            `}`,

            `class BloomFilter {`,
            `    constructor(expectedItems = 100000, falsePositiveRate = 0.01) {`,
            `        this.size = Math.ceil(-expectedItems * Math.log(falsePositiveRate) / (Math.log(2) ** 2));`,
            `        this.hashCount = Math.ceil(this.size / expectedItems * Math.log(2));`,
            `        this.bits = new Uint8Array(Math.ceil(this.size / 8));`,
            `    }`,
            `    add(item) { for (let i = 0; i < this.hashCount; i++) { const h = this._hash(item, i) % this.size; this.bits[h >> 3] |= 1 << (h & 7); } }`,
            `    mightContain(item) { for (let i = 0; i < this.hashCount; i++) { const h = this._hash(item, i) % this.size; if (!(this.bits[h >> 3] & (1 << (h & 7)))) return false; } return true; }`,
            `    _hash(str, seed) { let h = seed | 0; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 0x5bd1e995); h ^= h >>> 13; } return h >>> 0; }`,

            `            const { fn, resolve, reject } = queue.shift(); running++;`,
